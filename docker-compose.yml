services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: courier, POSTGRES_USER: courier, POSTGRES_PASSWORD: courier_dev }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U courier -d courier"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["courier_data:/var/lib/postgresql/data"]
  migrate:
    build: .
    entrypoint: ["courier-migrate"]
    environment: { DATABASE_URL: "postgres://courier:courier_dev@db:5432/courier?sslmode=disable" }
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
  seed:
    build: .
    entrypoint: ["courier-seed"]
    environment:
      DATABASE_URL: postgres://courier:courier_dev@db:5432/courier?sslmode=disable
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: AdminPass123!
      SEED_DISPATCHER_EMAIL: dispatcher@example.com
      SEED_DISPATCHER_PASSWORD: Dispatcher123!
      SEED_COURIER_EMAIL: courier@example.com
      SEED_COURIER_PASSWORD: CourierPass123!
      SEED_CUSTOMER_EMAIL: customer@example.com
      SEED_CUSTOMER_PASSWORD: CustomerPass123!
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
  api:
    build: .
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://courier:courier_dev@db:5432/courier?sslmode=disable
      JWT_SECRET: local-docker-secret-change-before-sharing
      JWT_EXPIRY: 30m
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
volumes: { courier_data: {} }
